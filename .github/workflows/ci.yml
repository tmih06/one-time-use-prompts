name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prompts:
    name: Prompt library
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Validate catalog against prompt files
        run: python3 scripts/validate-catalog.py

      - name: Scan prompts for injection patterns
        run: python3 scripts/scan-prompt-injection.py

  site:
    name: Check, typecheck, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: sync derives each prompt's "updated" date from its last commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # vp and wrangler are node CLIs, so a node runtime must be on PATH.
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # setup-bun caches the bun binary only; cache the package cache ourselves.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Regenerates site/content/docs — the fumadocs macro in src/lib/source.ts
      # reads it at type-check time, so it must exist before check/typecheck.
      - name: Sync prompt content
        run: bun run sync

      - name: Format, lint, type-aware check
        run: bun run check

      - name: Typecheck (tsc, root + site)
        run: bun run typecheck

      - name: Build site
        run: bun run build

      - name: Audit dependencies
        run: bun audit
